<script>
  let currentMode = 'U2B';

  function runConversion(mode) {
    currentMode = mode;
    const btnU2B = document.getElementById('btnU2B');
    const btnB2U = document.getElementById('btnB2U');
    
    if(mode === 'U2B') {
      btnU2B.className = 'pill-btn active';
      btnB2U.className = 'pill-btn inactive';
      convertU2B();
    } else {
      btnU2B.className = 'pill-btn inactive';
      btnB2U.className = 'pill-btn active';
      convertB2U();
    }
  }

  function autoConvert() {
    if(currentMode === 'U2B') {
      convertU2B();
    }
  }

  function triggerSwap() {
    if(currentMode === 'U2B') {
      runConversion('B2U');
    } else {
      runConversion('U2B');
    }
  }

  function clearText(id) {
    document.getElementById(id).value = '';
  }

  function copyText(id) {
    const el = document.getElementById(id);
    if (!el.value) return;
    el.select();
    navigator.clipboard.writeText(el.value);
  }

  async function pasteText(id) {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById(id).value = text;
      autoConvert();
    } catch (err) {
      alert('Please allow clipboard paste permission');
    }
  }

      return (c2 ? c1 + "্" + c2 : c1) + "©";
